services:
  api:
    build: .
    ports:
      - "3001:3000"
    environment:
      MONGO_URL: mongodb://root:example@mongo:27017/assignment_1?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    restart: unless-stopped
    networks: [backend]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:

networks:
  backend:
    driver: bridge
    name: assignment_1_backend
